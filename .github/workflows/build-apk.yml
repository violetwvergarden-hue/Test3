name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Extract ZIP Project
        run: |
          python3 -c 'import glob, zipfile; [zipfile.ZipFile(z).extractall(".") for z in glob.glob("*.zip")]'
          ls -la

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Prepare Android SDK & Build APK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/tools.zip
            python3 -c 'import zipfile; zipfile.ZipFile("/tmp/tools.zip").extractall("/tmp/cmdtools")'
            mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            chmod -R +x "$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER"
            (yes || true) | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi
          curl -sSL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          python3 -c 'import zipfile; zipfile.ZipFile("/tmp/gradle.zip").extractall("/tmp")'
          chmod +x /tmp/gradle-8.6/bin/gradle
          /tmp/gradle-8.6/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: 5. Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaScreenTranslator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
