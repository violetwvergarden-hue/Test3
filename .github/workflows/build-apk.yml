name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Extract ZIP Project
        run: |
          ls -la
          python3 -c 'import os, shutil, zipfile; [zipfile.ZipFile(os.path.join(r, f)).extractall(".") for r, d, fl in os.walk(".") if ".git" not in r for f in fl if zipfile.is_zipfile(os.path.join(r, f))]; sub = next((r for r, d, fl in os.walk(".") if "settings.gradle" in fl and r != "."), None); [shutil.move(os.path.join(sub, x), x) for x in (os.listdir(sub) if sub else [])]'
          ls -la
          test -f settings.gradle

      - name: 3. Prepare Android SDK & Build APK
        run: |
          if [ -n "$JAVA_HOME_17_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_17_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          java -version
          sudo chown -R $USER:$USER "$ANDROID_HOME" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          fi
          curl -sSL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          python3 -c 'import zipfile; zipfile.ZipFile("/tmp/gradle.zip").extractall("/tmp")'
          chmod +x /tmp/gradle-8.6/bin/gradle
          /tmp/gradle-8.6/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: 4. Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaScreenTranslator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
